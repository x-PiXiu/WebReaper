# WebReaper 容器编排
#
# 设计：与已有 zhichen 项目一致——network_mode: host，通过 localhost 连已有 MySQL。
# MySQL 共享 zhichen-mysql（:13306），在已有实例里建 webreaper database 即可。
# Redis（WSL/云端实例，:6379）——分布式锁/三防缓存/回调 nonce/运营指标共用；
# REDIS_HOST 留空或连接失败时自动降级单机模式（NoopLock/内存 nonce/无缓存），业务不中断。
# 前端独立部署到宿主机 nginx（不进容器），nginx 反代 /api/* 和 /media/* 到容器。

services:
  webreaper:
    build: .
    container_name: webreaper
    restart: unless-stopped
    # host 网络：容器直接用宿主机网络栈，localhost:13306 连已有 MySQL
    network_mode: host
    dns:
      - 8.8.8.8
      - 223.5.5.5
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      APP_ENV: production
      SERVER_PORT: "8082"
      # 路由统一前缀（nginx 分流用——前端 VITE_API_PREFIX 必须与此一致）
      API_PREFIX: /webreaper
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8082}
      # MySQL（共享已有 zhichen-mysql，端口 13306）
      DB_HOST: localhost
      DB_PORT: "13306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zhichen2026}
      DB_NAME: webreaper
      # Redis（分布式锁/三防缓存/回调 nonce/运营指标——留空自动降级单机）
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-16379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # LLM（内容生成/AI 监测用）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.minimaxi.com/v1}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M2.5}
      # Vidu 视频/图片/音频生成
      VIDU_API_KEY: ${VIDU_API_KEY:-}
      # 高德地图（本地生活 GEO）
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      # 抖音开放平台 OAuth（官方授权绑定——API 通道；KEY 留空=仅浏览器扫码绑定）
      DOUYIN_CLIENT_KEY: ${DOUYIN_CLIENT_KEY:-}
      DOUYIN_CLIENT_SECRET: ${DOUYIN_CLIENT_SECRET:-}
      # 回调地址必须与抖音控制台配置完全一致（含 /webreaper 前缀）
      DOUYIN_OAUTH_CALLBACK: ${DOUYIN_OAUTH_CALLBACK:-https://your-domain.com/webreaper/api/v1/merchant/accounts/douyin/oauth/callback}
      # ⚠️ 只能填应用已开通的 scope（含未开通项授权页直接报「scope权限非法」）；
      # 拿到视频发布/数据权限后按控制台实际开通项扩展，逗号分隔
      DOUYIN_OAUTH_SCOPE: ${DOUYIN_OAUTH_SCOPE:-user_info}
      # OAuth 回调完成后 302 跳回的前端地址
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Bing 收录
      BING_API_KEY: ${BING_API_KEY:-}
      BING_SITE_URL: ${BING_SITE_URL:-}
      # 安全
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLISH_COOKIE_SECRET: ${PUBLISH_COOKIE_SECRET:-change-me-in-production}
      # RPA 浏览器（容器无显示器 → headless）
      QR_LOGIN_HEADED: "false"
      # 发布 DRY_RUN（true=走完上传+填表截图但不点发布——真机验证选择器用，生产勿开）
      PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-}
      # 其他
      AUTO_MONITOR_ENABLED: ${AUTO_MONITOR_ENABLED:-true}
      TELEMETRY_ENABLED: "false"
      # 文件存储（oss=阿里云 OSS 云端持久化；local=本地磁盘）
      STORAGE_TYPE: ${STORAGE_TYPE:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-guangzhou.aliyuncs.com}
      OSS_INTERNAL_ENDPOINT: ${OSS_INTERNAL_ENDPOINT:-oss-cn-guangzhou-internal.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
    volumes:
      # 媒体素材持久化（用户上传 + Vidu 产物转存）
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
