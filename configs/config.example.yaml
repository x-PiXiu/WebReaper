# WebReaper 配置示例
# 骨架阶段未实际读取本文件；后续接入真实适配器时由 main 加载。

server:
  port: 8082

database:
  # 选型推迟：当前使用内存 mock，后续填真实配置
  driver: mysql           # mysql | postgres
  host: 127.0.0.1
  port: 3306
  username: root
  password: ""
  dbname: webreaper

vector_store:
  # 向量库（语义检索），后续接入
  type: pgvector          # pgvector | milvus
  dimension: 1536

ai:
  # trpc-agent-go 配置，后续接入
  provider: trpc-agent-go
  model: ""               # 具体 LLM 模型名
  max_tokens: 4096
  budget_tokens_per_day: 1000000   # Token 预算上限（成本控制）

crawler:
  rate_limit_ms: 1000              # 请求间隔（反爬）
  retry: 3
  timeout_s: 30
  proxy_pool: []                   # 代理池，可选

sources:
  - name: boss-default
    source_type: boss
    enabled: true
    config:
      keyword: "Go"
      city: "北京"
      max_page: 5
  - name: lagou-default
    source_type: lagou
    enabled: false
    config:
      keyword: "后端"
