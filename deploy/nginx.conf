# WebReaper nginx 配置（宿主机 nginx）
#
# 站点：https://huoke.zhichen.chat（获客智能体）
# 架构：前端静态文件（dist/）由 nginx 直接托管；
#       /webreaper/*（API+媒体）、/public/*（公开内容站）反代到容器（localhost:8082）。
# ⚠️ 抖音 OAuth 回调要求 HTTPS——443 配置是硬要求，不能只开 80。
#
# 部署步骤：
#   0. 阿里云 DNS：A 记录 huoke → 服务器公网 IP
#   1. 签发证书（certbot 会自动改写本配置的 ssl 部分）：
#      apt install certbot python3-certbot-nginx
#      certbot --nginx -d huoke.zhichen.chat
#   2. 前端构建：cd web && npm run build → 产物 dist/
#   3. 拷贝到 nginx 目录：mkdir -p /var/www/webreaper && cp -r web/dist /var/www/webreaper/
#   4. 将此配置放到 /etc/nginx/conf.d/huoke.conf（或 sites-enabled 软链）
#   5. nginx -t && nginx -s reload
#   6. certbot 自动续期（systemd timer 已内置）：certbot renew --dry-run 验证

# HTTP → HTTPS 强制跳转（certbot 会在此 server 补 ACME challenge 例外）
server {
    listen 80;
    server_name huoke.zhichen.chat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name huoke.zhichen.chat;

    # 证书（certbot --nginx 签发后为准；自备阿里云 DV 证书则替换为自己的路径）
    ssl_certificate     /etc/letsencrypt/live/huoke.zhichen.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huoke.zhichen.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态文件
    root /var/www/webreaper/dist;
    index index.html;

    # SPA 路由回退（React Router 的 history 模式——OAuth 回调 302 到 /distribution 也靠它）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebReaper API + 媒体（统一前缀 /webreaper 分流——与 zhichen 项目并存；
    # 抖音 OAuth 回调完整路径即 https://huoke.zhichen.chat/webreaper/api/v1/merchant/accounts/douyin/oauth/callback）
    location /webreaper/ {
        proxy_pass http://localhost:8082;  # 不带尾部 / → 保留 /webreaper 前缀传给后端
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # WebSocket 支持（AI 对话流式）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 公开内容站（无前缀——AI 引擎/搜索引擎爬取的公开文章页/sitemap/llms.txt/列表页）
    # 后端公开路由挂在无前缀组（与 IndexNow key 文件同设计原则）
    # /public 与 /public/ 都要反代（nginx 前缀匹配 location /public/ 不含无斜杠的 /public）
    location = /public {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
    }
    location /public/ {
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # robots.txt（爬虫访问规则——公开站必备，协议要求根目录）
    location = /robots.txt {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
    }

    # IndexNow 密钥文件（协议要求在域名根目录，不加前缀）
    # 注意：密钥是 UUID 格式（含连字符），正则必须含 -
    location ~ ^/[a-zA-Z0-9-]+\.txt$ {
        proxy_pass http://localhost:8082;
    }

    # 静态资源缓存（Vite 构建的 assets 带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
