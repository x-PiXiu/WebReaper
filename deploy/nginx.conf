# WebReaper nginx 配置（宿主机 nginx）
#
# 前端：静态文件（dist/）由 nginx 直接托管
# 后端：/api/* 和 /media/* 反代到容器（localhost:8082）
#
# 部署步骤：
#   1. 前端构建：cd web && npm run build → 产物 dist/
#   2. 拷贝到 nginx 目录：cp -r dist/ /var/www/webreaper/
#   3. 将此配置放到 nginx sites 目录（/etc/nginx/sites-available/ 或 conf.d/）
#   4. nginx -t && nginx -s reload

server {
    listen 80;
    server_name your-domain.com;  # ← 改成你的域名

    # 前端静态文件
    root /var/www/webreaper/dist;
    index index.html;

    # SPA 路由回退（React Router 的 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebReaper API + 媒体（统一前缀 /webreaper 分流——与 zhichen 项目并存）
    location /webreaper/ {
        proxy_pass http://localhost:8082;  # 不带尾部 / → 保留 /webreaper 前缀传给后端
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # WebSocket 支持（AI 对话流式）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # IndexNow 密钥文件（协议要求在域名根目录，不加前缀）
    # 注意：密钥是 UUID 格式（含连字符），正则必须含 - 
    location ~ ^/[a-zA-Z0-9-]+\.txt$ {
        proxy_pass http://localhost:8082;
    }

    # 静态资源缓存（Vite 构建的 assets 带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}

